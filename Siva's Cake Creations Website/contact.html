<!DOCTYPE html>
<html lang="en">
    <head>
        <title>CONTACT</title>
        <meta charset="UTF-8">
        <meta name="description" content="Contact Siva's Cake">
        <meta name="author" content="Padmavathi">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body class="contact-page">
        <!--Navigation Section NAVBAR-->
            <nav>
                <ul> 
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="contact.html">CONTACT US</a></li>
                </ul>
            </nav>
        <!--Header-->
        <header>
            <div>
                <h1>Contact Us!</h1>
            </div>
        </header> 
        <!--Form-->
        <section>
            <div>
                <h3>Please provide your contact information and a brief message of your inquiry.</h3>
            </div>
            <div>
                <form action="" method="get">
                    <table>
                        <tr>
                            <td>
                                FirstName
                            </td>
                            <td>
                                <input type="text" placeholder="Enter First Name" name="Fname">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                LastName
                            </td>
                            <td>
                                <input type="text" placeholder="Enter Last Name" name="Lname">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                Email
                            </td>
                            <td>
                                <input type="email" placeholder="Enter Email" name="Email">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                Phone Number
                            </td>
                            <td>
                                <input type="tel" placeholder="Enter number" name="Phone">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                Message
                            </td>
                            <td>
                                <textarea placeholder="Type your message here"></textarea>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2">
                                <input type="checkbox" id="Newsletter">
                                <label for="Newsletter">Would you like to receive our monthly newsletter?</label><br>
                            </td>                           
                        </tr>
                        <tr>
                            <td colspan="2">
                                <input type="submit" value="Submit">
                            </td>
                        </tr>
                    </table>                   
                </form>
            </div>
        </section>      
        <!--Footer-->
        <footer>
            <em>
                <h6>
                    <p>Siva's Cake Creations! &copy; 30 Denton Avenue, Scarborough, ON M1L4P2. Call +1-647-867-9007</p>                    
                </h6>
            </em>
        </footer>
    </body>
</html>
